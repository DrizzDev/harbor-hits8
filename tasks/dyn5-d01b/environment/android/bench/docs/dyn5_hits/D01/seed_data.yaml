cartsf:
  how: 'No built database: seed.py resets CartSF through its data API (simulator QUIET, clock offset 0), pins the
    stock below, then runs the SQL. seed_snapshot/cartsf.before.db is that state as saved by a real trial.'
  stock_pins:
    bay-market:
      p-russet-potatoes: true
      p-half-and-half: true
      p-garlic: true
      p-sourdough: true
      p-chicken-broth: true
      p-yellow-onions: true
      p-napkins: true
      p-paper-towels: true
      p-sparkling-water: true
      p-honeycrisp-apples: true
      p-vanilla-ice-cream: true
      p-ground-coffee: true
      p-ipa: true
      p-oat-milk: true
      p-sparkling-wine: true
      p-gala-apples: true
  sql: "\n    UPDATE orders SET status = 'DELIVERED', placedAt = placedAt - 345600000, deliveredAt = placedAt -\
    \ 335000000,\n        windowStartMillis = windowStartMillis - 345600000, windowEndMillis = windowEndMillis -\
    \ 345600000,\n        itemsFound = itemsTotal WHERE id = 'o-seed-live';\n    UPDATE order_items SET outcome\
    \ = 'FOUND', finalCents = estimatedCents WHERE orderId = 'o-seed-live';\n    DELETE FROM replacement_requests\
    \ WHERE orderId = 'o-seed-live';\n    UPDATE payment_methods SET holder = 'ALEX MORGAN';\n"

- from: Dr. Dana Okafor <dana.okafor@ggsu.example>
  subject: NY trip - travel rules (read before booking!)
  sent: Fri 16 Oct 2026 18:40 PT
  body: 'Hi Alex,


    The department approved ESCRO in New York. You''re booking for the four of you (you, Neha, Kabir and Tomas).
    Rules, because the club account is nearly empty:


    FLIGHTS

    1. Out on Thursday 12 Nov, back on Monday 16 Nov. Economy, the cheapest fare that works.

    2. Team check-in at the Expo Hall closes at 5:00 PM New York time on Thursday, and it''s an hour from either
    airport, so you have to LAND by 4:00 PM Eastern.

    3. The hostel doors are locked midnight to 6 AM, so no flight that leaves SFO before 6:00 AM.

    4. We''re packing the pit until noon on Monday, so the flight home can''t leave before 1:00 PM Eastern.

    5. Everyone on the same flights, both ways. JFK or Newark, I don''t mind which.

    6. The robot crate flies as ONE checked bag, each way, on Tomas''s ticket (he''s the crate handler). Nobody
    else checks a bag. No paid seats.

    7. Names and dates of birth exactly as on your IDs - roster below.


    STAY

    One Airbnb for all of us, Thursday night to Monday morning. It has to be in Manhattan (we''re walking to Pier
    92), it needs a real kitchen because we''re cooking to save money, and the whole stay must come to $1,600 or
    less all in. Cheapest that works.


    ROSTER (as on ID)

    Alex Morgan  -  DOB 11 Jul 2004  -  male

    Neha Sharma  -  DOB 14 Mar 2005  -  female

    Kabir Mehta  -  DOB 2 Sep 2004  -  male

    Tomas Alvarez  -  DOB 21 Jan 2005  -  male


    Text everyone the flights and the address when it''s done.


    Dana'

- from: Linda Morgan <linda.morgan@mailbox.example>
  subject: Thanksgiving list (Bay Market!!)
  sent: Tue 24 Nov 2026 21:12 PT
  body: 'Hi sweetie,


    Here''s the list for tomorrow. Everything from Bay Market please, one order. It''s 8 of us. I put what to get
    if they''re out - shoppers always call about something.


    - Whole chickens, 8 lb total (we''re roasting two instead of a turkey this year). If they''re out of whole chickens:
    chicken THIGHS, 6 lb. Not breasts, they dry out.

    - Russet potatoes, 2 bags

    - Carrots, 2 bags

    - Yellow onions, 1 bag

    - Garlic, 3 heads

    - Fresh basil x2

    - Chicken broth x3

    - Large eggs, 2 dozen (pies). If no regular eggs, organic are fine. NOT the egg whites in a carton.

    - Honeycrisp apples, 3 lb for the pie. If they don''t have honeycrisp, Gala. Nothing else, it has to be apples!

    - Flour x1, sugar x1

    - Oat milk x1 for Dad''s coffee (he can''t have dairy, don''t let them sub real milk!). If no oat milk, the
    unsweetened almond.

    - Parmesan wedge x1. If they''re out don''t replace it, I have half a wedge.

    - Vanilla ice cream x1


    Use my code CART20, and tip them 15% - they''re working the day before a holiday.

    Delivery between 3 and 5 please, I''m at work until 3 and I want the chickens in the brine by dinner.


    Love, Mom'

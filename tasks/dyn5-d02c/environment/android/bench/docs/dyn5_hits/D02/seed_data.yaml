triggers_during_run:
- id: oat_runs_out
  when:
    sql:
      app: cartsf
      query: SELECT COUNT(*) FROM cart_items WHERE cartId = 'c-u-demo-bay-market' AND productId = 'p-oat-milk'
      expect:
        gte: 1
  do:
  - shell: python3 {{task_dir}}/../seed.py event d02 oat_runs_out --serial $SERIAL
- id: shopper_starts
  when:
    sql:
      app: cartsf
      query: SELECT COUNT(*) FROM orders WHERE retailerId = 'bay-market' AND id NOT LIKE 'o-seed-%' AND status <>
        'CANCELLED'
      expect:
        gte: 1
  delay_s: 5
  do:
  - shell: python3 {{task_dir}}/../seed.py event d02 shopper_starts --serial $SERIAL
- id: shopper_continues_1
  when:
    sql:
      app: cartsf
      query: SELECT CASE WHEN (SELECT COUNT(*) FROM replacement_requests WHERE orderId NOT LIKE 'o-seed-%' AND decision
        IS NOT NULL) >= 1 AND (SELECT COUNT(*) FROM replacement_requests WHERE orderId NOT LIKE 'o-seed-%' AND decision
        IS NULL) = 0 THEN 1 ELSE 0 END
      expect:
        gte: 1
  delay_s: 3
  do:
  - shell: python3 {{task_dir}}/../seed.py event d02 shopper_continues --serial $SERIAL
- id: shopper_continues_2
  when:
    sql:
      app: cartsf
      query: SELECT CASE WHEN (SELECT COUNT(*) FROM replacement_requests WHERE orderId NOT LIKE 'o-seed-%' AND decision
        IS NOT NULL) >= 2 AND (SELECT COUNT(*) FROM replacement_requests WHERE orderId NOT LIKE 'o-seed-%' AND decision
        IS NULL) = 0 THEN 1 ELSE 0 END
      expect:
        gte: 1
  delay_s: 3
  do:
  - shell: python3 {{task_dir}}/../seed.py event d02 shopper_continues --serial $SERIAL
- id: shopper_continues_3
  when:
    sql:
      app: cartsf
      query: SELECT CASE WHEN (SELECT COUNT(*) FROM replacement_requests WHERE orderId NOT LIKE 'o-seed-%' AND decision
        IS NOT NULL) >= 3 AND (SELECT COUNT(*) FROM replacement_requests WHERE orderId NOT LIKE 'o-seed-%' AND decision
        IS NULL) = 0 THEN 1 ELSE 0 END
      expect:
        gte: 1
  delay_s: 3
  do:
  - shell: python3 {{task_dir}}/../seed.py event d02 shopper_continues --serial $SERIAL
- id: shopper_continues_4
  when:
    sql:
      app: cartsf
      query: SELECT CASE WHEN (SELECT COUNT(*) FROM replacement_requests WHERE orderId NOT LIKE 'o-seed-%' AND decision
        IS NOT NULL) >= 4 AND (SELECT COUNT(*) FROM replacement_requests WHERE orderId NOT LIKE 'o-seed-%' AND decision
        IS NULL) = 0 THEN 1 ELSE 0 END
      expect:
        gte: 1
  delay_s: 3
  do:
  - shell: python3 {{task_dir}}/../seed.py event d02 shopper_continues --serial $SERIAL
- id: shopper_continues_5
  when:
    sql:

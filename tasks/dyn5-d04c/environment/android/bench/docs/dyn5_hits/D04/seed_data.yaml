    eleven on Wednesday morning I''m home then. Oh and he won''t eat salmon, never has, so get the cod. The doctor
    said any white fish is fine. OK. And you''re driving him to the heart doctor and the rehab thing so put those
    in your calendar. Ben said he''d do the others. Love you bye."



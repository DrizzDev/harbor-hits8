    \ = 'FOUND', finalCents = estimatedCents WHERE orderId = 'o-seed-live';\n    DELETE FROM replacement_requests\
    \ WHERE orderId = 'o-seed-live';\n    UPDATE payment_methods SET holder = 'ALEX MORGAN';\nINSERT INTO addresses\
    \ (id, userId, label, line1, line2, city, state, postcode, instructions, isDefault) VALUES ('a-parents', 'u-demo',\
    \ 'Mom & Dad', '2150 Lake St', '', 'San Francisco', 'CA', '94121', '', 0);\n"
